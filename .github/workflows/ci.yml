name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web SPA
        run: ./scripts/build-web.sh
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./... -count=1

  cross-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web SPA
        run: ./scripts/build-web.sh
      - name: Cross compile ${{ matrix.target }}
        run: ./scripts/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-console-${{ matrix.target }}
          path: bin/
