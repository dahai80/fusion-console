name: CI

# fusion#2 checklist: skip runs for docs-only changes (README, docs/,
# acceptance/ evidence) — CI still gates every code path.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "acceptance/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "acceptance/**"
      - "LICENSE"

# Cancel superseded runs on the same ref (branch) so pushes that land in
# quick succession do not queue redundant full pipelines.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPA built once and shared via artifact — the 5 cross-build targets
  # reuse it instead of each rebuilding the bundle with bun.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache web dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: web-bun-${{ runner.os }}-
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Build web SPA
        run: bun run build
        working-directory: web
      - name: Upload webdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist
          retention-days: 3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache web dependencies
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: web-bun-${{ runner.os }}-
      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web
      # Lint must be zero-findings: go vet + gofmt for Go, tsc for the SPA.
      - name: Go vet (zero findings)
        run: go vet ./...
      - name: Go format (zero findings)
        run: test -z "$(gofmt -l .)"
      - name: SPA typecheck (zero findings)
        run: bunx tsc -b --force
        working-directory: web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # vet/gofmt live in the lint job — here only the tests run. The
      # committed webdist satisfies go:embed; no SPA build needed.
      - name: Test
        run: go test ./... -count=1

  cross-build:
    runs-on: ubuntu-latest
    needs: [web, lint, test]
    strategy:
      matrix:
        target: [darwin-arm64, darwin-amd64, linux-amd64, linux-arm64, windows-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
        # setup-go@v5 caches the Go build/module cache keyed on go.sum by
        # default — no extra action needed for the Go side.
      - name: Download webdist artifact
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist
      - name: Cross compile ${{ matrix.target }}
        run: ./scripts/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-console-${{ matrix.target }}
          path: bin/
